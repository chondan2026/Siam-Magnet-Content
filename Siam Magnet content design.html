                            gray: '#555555'

                        'fade-in': 'fadeIn 0.5s ease-out',

                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },

                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Sales */}
                    {filterPillars('sales') && (
                        <div className="animate-slide-up">
                            <h3 className="text-2xl font-serif font-bold text-brand-dark mb-4 mt-8 flex items-center gap-2">
                                <span className="bg-brand-brown text-white w-8 h-8 flex items-center justify-center rounded-full text-sm">3</span> 
                                Sales <span className="text-base font-sans font-normal text-brand-gray">(เน้นโชว์สินค้า)</span>
                            </h3>
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                                {pillarsData.sales.map((item, idx) => (
                                    <div key={idx} className="bg-white p-5 rounded-xl border border-brand-brown/20 flex flex-col items-center text-center hover:-translate-y-1 hover:shadow-lg transition-all duration-300">
                                        <div className="w-16 h-16 bg-brand-skin rounded-full flex items-center justify-center text-2xl text-brand-blue mb-3">
                                            <i className={`fa-solid ${item.icon}`}></i>
                                        </div>
                                        <h4 className="font-bold text-brand-dark mb-2">{item.title}</h4>
                                        <p className="text-brand-gray text-sm">{item.desc}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('facebook');

            return (
                <div className="max-w-6xl mx-auto px-4 py-8 md:py-12">
                    {/* Header */}
                    <header className="text-center mb-10 animate-slide-up">
                        <h1 className="text-4xl md:text-5xl font-serif font-bold text-brand-dark mb-3">Siam Magnet</h1>
                        <p className="text-xl text-brand-gray tracking-wide">Social Media Strategy & Content Plan</p>
                        <div className="w-24 h-1 bg-brand-brown mx-auto mt-6 rounded-full"></div>
                    </header>

                    {/* Navigation Tabs */}
                    <nav className="flex justify-center gap-2 md:gap-6 mb-10 overflow-x-auto pb-2">
                        {[
                            { id: 'facebook', label: 'Facebook', icon: 'fa-facebook' },
                            { id: 'instagram', label: 'Instagram', icon: 'fa-instagram' },
                            { id: 'pillars', label: 'Content Pillars', icon: 'fa-layer-group' }
                        ].map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`flex items-center gap-2 px-6 py-3 rounded-xl font-bold transition-all duration-300 whitespace-nowrap
                                    ${activeTab === tab.id 
                                        ? 'bg-brand-dark text-brand-skin shadow-xl scale-105' 
                                        : 'bg-white text-brand-gray hover:bg-brand-skin border border-brand-brown/20'}`}
                            >
                                <i className={`fa-brands ${tab.icon} text-lg ${activeTab === tab.id ? 'text-brand-blue' : ''}`}></i>
                                {tab.label}
                            </button>
                        ))}
                    </nav>

                    {/* Content Area */}
                    <main className="min-h-[500px]">
                        {activeTab === 'facebook' && <PlatformStrategy data={fbData} platform="facebook" />}
                        {activeTab === 'instagram' && <PlatformStrategy data={igData} platform="instagram" />}
                        {activeTab === 'pillars' && <ContentPillars />}
                    </main>
                    
                    {/* Footer */}
                    <footer className="text-center mt-16 pt-8 border-t border-brand-brown/30 text-brand-gray text-sm">
                        Modern Heritage Design • Siam Magnet Interactive Strategy
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
